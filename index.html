function fmt(v){

}

function copyTable(p,args,vals){

/* 정답보다 넓게 잡은 범위는 머리글 행이나 빈 행처럼 숫자가 없는 행만 허용, 열 확장은 조회 표(wide)만 */
function rangeOk(S,u,v,wide){
  if(!covers(u,v)) return false;
  if(!wide&&(u.c1!==v.c1||u.c2!==v.c2)) return false;
  for(let r=u.r1;r<=u.r2;r++) for(let c=u.c1;c<=u.c2;c++){
    const inRows=r>=v.r1&&r<=v.r2; if(inRows) continue; if(!(r===0||r>=S.length)) return false;

function judge(g,p,a){

  const inPair=new Set((g.pairs||[]).flat());
  for(let i=0;i<sl.length&&bad<0;i++){ if(inPair.has(i)) continue; const s=sl[i],u=a[i],v=p.solA[i];
    if(s.t==='choice'&&u!==v){ if(!g.loose) bad=i; } else if(s.t==='cell'&&!sameRef(u,v)) bad=i; else if(s.t==='range'&&!rangeOk(p.S,u,v,s.wide)) bad=i; }
  if(bad<0&&g.pairs){ const pool=g.pairs.map(([x,y])=>({r:p.solA[x],c:p.solA[y]}));
    for(const [x,y] of g.pairs){ const ur=a[x],uc=a[y];
      const k=pool.findIndex(o=>o.c===uc&&ur.c1===o.r.c1&&ur.c2===o.r.c2&&covers(ur,o.r));
      if(k<0){ bad=pool.some(o=>o.c===uc)?x:y; break; } pool.splice(k,1); } }
  const okRes=eqRes(res,p.exp); let ok=bad<0&&okRes;
  if(!ok&&bad<0){ bad=sl.findIndex((s,i)=>(s.t==='range'&&!sameRef(a[i],p.solA[i]))||(g.loose&&s.t==='choice'&&a[i]!==p.solA[i])); if(bad<0) bad=-2; }
  let why='';
  if(ok){ const k=sl.findIndex((s,i)=>s.abs&&!(a[i].m===1||a[i].m===2)); if(k>=0){ ok=false; bad=k; why='abs'; } }
  return {ok,res,bad,why};
}
function updateNav(){ document.querySelectorAll('.qnav button').forEach((b,i)=>b.classList.toggle('done',!!store.solved[st.gid+':'+i])); }
function reveal(){ const p=P(); st.args=p.solA.map(x=>x&&typeof x==='object'?{...x}:x); st.revealed=true; st.result={ok:true,shown:true}; drawAll(); }
function next(){ if(st.qi<G().list.length-1){ st.qi++; reset(); render(); } else { st.view='home'; render(); } window.scrollTo(0,0); }

/* ---------- 단축키 문제 ---------- */
function keyPlay(){
  const p=P();
  app.innerHTML=`${topBar()}
  <p class="q">${esc(p.q)}</p>
  <div class="combo" id="combo"></div>
  <div class="helper" id="helper"></div>
  <span class="lbl">보조키</span>
  <div class="mods">${MODS.map(m=>`<button class="mod" data-m="${m}" aria-pressed="false">${m}</button>`).join('')}</div>
  <span class="lbl">키</span>
  <div class="keys">${KEYS.map(k=>`<button class="key" data-k="${esc(k)}">${esc(k)}</button>`).join('')}</div>
  <div class="actions"><button class="ghost" id="clear">지우기</button><button class="primary" id="go">확인</button></div>
  <p class="tip">PC라면 실제 키보드로 눌러도 바로 채점됩니다. Ctrl+T처럼 브라우저가 먼저 가로채는 조합은 화면 버튼으로 고르세요. 방향키는 ↑↓←→ 중 아무거나 같은 뜻으로 칩니다.</p>`;
  drawKey();
}
const caps=arr=>arr.map(k=>`<span class="kc">${esc(k)}</span>`).join('<span class="plus">+</span>');
function drawKey(){
  const p=P(),r=st.result; const sel=[...MODS.filter(m=>st.mods.includes(m)),...(st.key?[st.key]:[])];
  document.getElementById('combo').innerHTML=sel.length?caps(sel):'<span class="ph">보조키와 키를 골라 조합을 만드세요</span>';
  document.querySelectorAll('.mod').forEach(b=>{ const on=st.mods.includes(b.dataset.m); b.classList.toggle('on',on); b.setAttribute('aria-pressed',on); });
  document.querySelectorAll('.key').forEach(b=>b.classList.toggle('on',b.dataset.k===st.key));
  const last=st.qi===G().list.length-1, nextBtn=`<button class="primary" id="next">${last?'목록으로':'다음 문제 →'}</button>`;
  let out='';
  if(st.msg) out=`<p class="msg">${esc(st.msg)}</p>`;
  if(r){ if(r.ok) out=`<div class="fb ${r.shown?'show':'ok'}"><span class="h">${r.shown?'정답':'정답입니다'}</span><div class="row">${caps(p.k)}</div><p>${esc(p.w)}</p><div class="row">${nextBtn}</div></div>`;
    else out=`<div class="fb bad"><span class="h">다른 조합이에요</span><p>${r.hint}</p><div class="row"><button class="ghost" id="retry">다시 고르기</button><button class="ghost" id="reveal">정답 보기</button></div></div>`; }
  document.getElementById('helper').innerHTML=out;
}
function keyCheck(){
  const p=P(); if(!st.key){ st.msg='메인 키를 하나 골라주세요.'; drawKey(); return; }
  const wm=p.k.filter(k=>MODS.includes(k)), wk=p.k.find(k=>!MODS.includes(k));
  const modOk=wm.length===st.mods.length&&wm.every(m=>st.mods.includes(m)), keyOk=st.key===wk;
  const ok=modOk&&keyOk;
  st.result={ok,hint:keyOk?'키는 맞았어요. 보조키 조합을 다시 생각해보세요.':modOk?'보조키는 맞았어요. 함께 누를 키가 달라요.':'보조키와 키 둘 다 다시 골라보세요.'}; st.msg='';
  if(ok&&!st.revealed){ store.solved[st.gid+':'+st.qi]=1; save(); }
  drawKey(); updateNav();
}
const CODE={ArrowUp:'방향키',ArrowDown:'방향키',ArrowLeft:'방향키',ArrowRight:'방향키',Home:'Home',Space:'Space',Enter:'Enter',NumpadEnter:'Enter',F2:'F2',F4:'F4',Semicolon:';',Equal:'=',Digit1:'1',KeyC:'C',KeyD:'D',KeyG:'G',KeyL:'L',KeyT:'T',KeyV:'V',KeyZ:'Z'};

/* ---------- 이벤트 ---------- */
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return; const d=t.dataset;
  if(d.tab){ st.level=d.tab; store.level=d.tab; save(); home(); return; }
  if(d.g){ st.gid=d.g; st.qi=0; st.view='play'; reset(); render(); window.scrollTo(0,0); return; }
  if(t.id==='back'){ st.view='home'; render(); window.scrollTo(0,0); return; }
  if(d.jump!=null){ st.qi=+d.jump; reset(); render(); return; }
  if(t.id==='reset'){ if(t.classList.contains('armed')){ store.solved={}; save(); home(); } else { t.classList.add('armed'); t.textContent='한 번 더 누르면 지워집니다'; } return; }
  if(t.id==='next'){ next(); return; }
  const isKey=G()&&G().kind==='key';
  if(isKey){
    if(d.m){ st.mods=st.mods.includes(d.m)?st.mods.filter(x=>x!==d.m):[...st.mods,d.m]; st.result=null; st.msg=''; drawKey(); return; }
    if(d.k!=null){ st.key=st.key===d.k?null:d.k; st.result=null; st.msg=''; drawKey(); return; }
    if(t.id==='clear'||t.id==='retry'){ st.mods=[]; st.key=null; st.result=null; st.msg=''; drawKey(); return; }
    if(t.id==='go'){ keyCheck(); return; }
    if(t.id==='reveal'){ const p=P(); st.mods=p.k.filter(k=>MODS.includes(k)); st.key=p.k.find(k=>!MODS.includes(k)); st.revealed=true; st.result={ok:true,shown:true}; drawKey(); return; }
    return;
  }
  if(d.slot!=null){ st.active=+d.slot; st.result=null; st.msg=''; drawAll(); return; }
  if(d.o!=null){ const p=P(); st.args[st.active]=p.opts[st.active][+d.o]; advance(); st.msg=''; drawAll(); return; }
  if(t.id==='clear'){ st.args=[]; st.active=0; st.result=null; st.msg=''; drawAll(); return; }
  if(t.id==='retry'){ const b=st.result&&st.result.bad; st.result=null; if(b>=0) st.active=b; drawAll(); return; }
  if(t.id==='go'){ check(); return; }
  if(t.id==='f4'){ pressF4(); return; }
  if(t.id==='reveal'){ reveal(); return; }
});
document.addEventListener('keydown',e=>{
  if(st.view!=='play') return; const g=G();
  if(g.kind==='key'){
    const plain=!e.ctrlKey&&!e.altKey&&!e.shiftKey&&!e.metaKey;
    if(e.code==='Enter'&&plain&&st.result&&st.result.ok){ e.preventDefault(); next(); return; }
    const k=CODE[e.code]; if(!k) return; e.preventDefault();
    if(st.result&&st.result.ok) return;
    st.mods=MODS.filter(m=>m==='Ctrl'?(e.ctrlKey||e.metaKey):m==='Shift'?e.shiftKey:e.altKey); st.key=k; keyCheck();
  } else if(e.key==='F4'){ e.preventDefault(); pressF4();
  } else if(e.key==='Enter'){
    e.preventDefault(); if(st.result&&st.result.ok) next(); else check();
  }
});
render();
</script>

    _r();
    if (st.view === 'play' && location.hash !== '#play') location.hash = 'play';
    if (st.view === 'home' && location.hash === '#play') history.back();
  };
  window.addEventListener('hashchange', function(){
    if (location.hash !== '#play' && st.view === 'play') { st.view = 'home'; _r(); window.scrollTo(0,0); }
  });
})();
</script>
